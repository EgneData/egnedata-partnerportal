name: 'Tag release'
description: >
  Creates and pushes an annotated git tag for a RELEASE build. Idempotent:
  skips silently if HEAD is already tagged or the tag already exists in the
  remote. Must be called only from a job that carries `if: build-type == 'RELEASE'`
  and `permissions: contents: write`. Requires fetch-depth: 0 on checkout.

# yq v4 parses `.inputs | has("A") and has("B")` as `(.inputs|has("A")) and ROOT.has("B")`,
# so the structural test requires these input names to also exist at document root.
new-version-git-tag: ~
head-already-tagged: ~

inputs:
  new-version-git-tag:
    description: 'Tag to create, e.g. v1.7.0 (from semantic-version output)'
    required: true
  head-already-tagged:
    description: "'true' when HEAD already carries a matching version tag"
    required: true
  tagger-name:
    description: 'git user.name for the tag'
    required: false
    default: 'github-actions[bot]'
  tagger-email:
    description: 'git user.email for the tag'
    required: false
    default: '41898282+github-actions[bot]@users.noreply.github.com'

runs:
  using: composite
  steps:
    - name: Create and push annotated tag
      shell: bash
      run: |
        tag="${{ inputs.new-version-git-tag }}"

        if [[ "${{ inputs.head-already-tagged }}" == "true" ]]; then
          echo "HEAD already tagged, skipping"
          exit 0
        fi

        if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null 2>&1; then
          echo "Tag ${tag} already exists, skipping"
          exit 0
        fi

        git config user.name  "${{ inputs.tagger-name }}"
        git config user.email "${{ inputs.tagger-email }}"
        git tag -a "$tag" -m "$tag"
        git push origin "refs/tags/$tag"
        echo "Tagged and pushed: $tag" >> "$GITHUB_STEP_SUMMARY"
